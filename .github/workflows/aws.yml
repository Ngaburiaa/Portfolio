name: Deploy Portfolio to EC2

on:
  push:
    branches: ["master"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Deploy to EC2 via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          # Navigate to app directory, or clone repo if it doesn't exist
          cd ${{ secrets.APP_DIR }} || git clone https://github.com/Ngaburiaa/Portfolio.git ${{ secrets.APP_DIR }}
          cd ${{ secrets.APP_DIR }}
          
          # Pull latest code
          git pull origin master
          
          # Build Docker image using multi-stage Dockerfile (frontend + nginx)
          docker build -t portfolio-ui .
          
          # Stop and remove old container if exists
          docker stop portfolio-ui || true
          docker rm portfolio-ui || true
          
          # Run container with port 80 exposed (frontend served by Nginx)
          docker run -d -p 80:80 --name portfolio-ui portfolio-ui
